name: GitHub Actions Runner Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Show Node.js version
        run: node --version

      - name: Show runner information
        run: |
          echo "Operating System:"
          uname -a

          echo "Hostname:"
          hostname

          echo "User:"
          whoami

          echo "Working Directory:"
          pwd
name: Complete CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building application..."
          echo "Build completed successfully"

      - name: Test
        run: |
          echo "Running tests..."
          echo "Tests passed"

  docker:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/shiva62426242/github-actions-devops-first:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/shiva62426242/github-actions-devops-first:${{ github.sha }}
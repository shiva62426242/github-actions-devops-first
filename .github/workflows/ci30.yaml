name: Docker Push to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/shiva62426242/github-actions-devops-first:v1.0.0 .

      - name: Push Docker image
        run: |
          docker push ghcr.io/shiva62426242/github-actions-devops-first:v1.0.0
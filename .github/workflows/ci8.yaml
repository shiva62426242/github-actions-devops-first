name: Multiple Job Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Build
        run: |
          echo "Building application..."
          echo "Build completed"

  test:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Test
        run: |
          echo "Testing application..."
          echo "Tests passed"

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment completed"
